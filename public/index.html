<!doctype html>
<html lang="en" data-theme="__WORKSPACE_THEME__" data-tab-icon="__TAB_ICON_SET__">
  <head>
  <meta name="style-nonce" content="__STYLE_NONCE__">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="__BROWSER_THEME_COLOR__">
    <title>Goal · chill</title>
    <meta name="workspace-appearance" content="__WORKSPACE_APPEARANCE__">
    <link rel="icon" href="__TAB_ICON__">
    <script src="/appearance-boot.js"></script>
    <link rel="stylesheet" href="/workspace.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/themes.css">
    <script src="/vendor/workspace-app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <header class="app-header">
        <div class="header-inner">
          <div class="brand">
            <button type="button" class="brand-mark" aria-label="Tab icon"><img src="__TAB_ICON__" alt=""></button>
            <a href="#/goals" class="brand-link" aria-label="chill — Goals">chill<span class="brand-period">.</span></a>
          </div>
          <div class="header-actions"><span class="agent-control"><button type="button" id="agent-button" class="agent-trigger" aria-label="Agent" aria-describedby="agent-tooltip" aria-expanded="false" aria-controls="agent-panel" hidden></button><span id="agent-tooltip" class="extension-tooltip" role="tooltip">Agent<small>Settings, usage, and connection.</small></span></span>
          <button type="button" id="letters-button" class="header-letters" aria-label="Letters" aria-expanded="false" aria-controls="letters-panel" aria-haspopup="dialog"></button>
          <button type="button" id="runtime-update-button" class="header-letters runtime-update-button" aria-label="Update" hidden></button>
          <span id="extension-buttons" class="extension-buttons"></span></div>
        </div>
        <div id="update-notice" class="update-notice" role="status" hidden>
          <span id="update-notice-text"></span>
          <button type="button" id="view-update">View deliverable</button>
        </div>
      </header>
      <section id="agent-panel" class="agent-panel" role="dialog" aria-label="Agent" hidden>
        <div class="agent-panel-heading"><h2>Agent</h2><div><button type="button" data-agent-refresh aria-label="Refresh" title="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1a8.3 8.3 0 0 1 13.6 3.4M4.3 14.5a8.3 8.3 0 0 0 13.6 3.4"/></svg></button><button type="button" data-agent-close aria-label="Close">✕</button></div></div>
        <div id="agent-content"></div>
      </section>
      <section id="letters-panel" class="agent-panel letters-panel" role="dialog" aria-label="Letters" hidden></section>
      <main id="main" class="reading-pane" tabindex="-1"><p class="initial-loading" role="status">Opening your Goals…</p></main>
    </div>
    <p id="toast" class="toast" aria-hidden="true" hidden></p>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    <noscript>Enable JavaScript to view goals.</noscript>
  </body>
</html>
