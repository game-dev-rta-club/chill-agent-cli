name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm run release:check
      - run: npm ci
      - run: npm run check
      - name: Check release tag and promotion
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" *.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
